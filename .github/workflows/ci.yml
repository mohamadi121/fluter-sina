name: CI

# Static analysis + tests on every push to main and every pull request.
# Any failure (analyze, test, or a build break) fails the workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # Errors and warnings fail the build; lint infos are reported but do
        # not (they live in legacy screens slated for rewrite). Flip to strict
        # (drop --no-fatal-infos) once the final-audit batch clears them.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build debug APK (compile check)
        run: flutter build apk --debug

  web-image:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Reject broad Docker build inputs
        run: |
          ! grep -Eq '^[[:space:]]*COPY[[:space:]]+\.[[:space:]]' Dockerfile
          ! grep -Eq '^[[:space:]]*ADD[[:space:]]+\.' Dockerfile
      - name: Build production web image
        run: >-
          docker build
          --build-arg API_BASE_URL=https://asoud.example/api/v1/
          --tag asoud-frontend-ci:web
          .
      - name: Reject critical/high CVEs in the web runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: asoud-frontend-ci:web
          fail-build: true
          severity-cutoff: high
          output-format: table
